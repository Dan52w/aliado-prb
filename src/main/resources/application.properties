# ALIADO — configuración principal (Spring Boot 4.1.2, Java 21)
spring.application.name=aliado

# Base de datos (PostgreSQL). En desarrollo usa variables de entorno; por defecto apunta a localhost.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/aliado}
spring.datasource.username=${DATABASE_USERNAME:aliado}
spring.datasource.password=${DATABASE_PASSWORD:aliado}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA: el esquema lo gobierna Flyway; nunca ddl-auto en producción.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway (migraciones V1–V7 en src/main/resources/db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Servidor
server.port=${PORT:8080}
server.servlet.context-path=/

# Seguridad de la sesión (SPEC-01, sesión opaca revocable)
aliado.session.ttl-hours=${ALIADO_SESSION_TTL_HOURS:24}

# Almacenamiento de archivos local (SPEC-04; S3/MinIO es P-04 pendiente)
aliado.storage.dir=${ALIADO_STORAGE_DIR:./storage}

# Cifrado AES-256-GCM para la dirección exacta (SPEC-02).
# ALIADO_AES_KEY debe ser Base64 de 32 bytes. Sin ella se usa una clave de desarrollo (solo práctica).
aliado.crypto.key=${ALIADO_AES_KEY:}

# Administrador inicial (bootstrap). Sin estas variables no se crea.
aliado.admin.email=${ALIADO_ADMIN_EMAIL:}
aliado.admin.password=${ALIADO_ADMIN_PASSWORD:}

# Feature flags — el MVP deja todo el futuro APAGADO (plan general §3.1 y §27).
aliado.features.chat-interno=false
aliado.features.soporte-whatsapp=false
aliado.features.onboarding-asistido=false
aliado.features.mapa-prestadores=false
aliado.features.insignia-formalizacion=false
aliado.features.referidos=false
aliado.features.idiomas-adicionales=false
aliado.features.integracion-institucional=false
aliado.features.pagos.piloto-enabled=false
aliado.features.pagos.piloto-approved=false

# Documentación OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logs
logging.level.root=INFO
logging.level.com.sebastian.spring.mas.aliado.aliado=INFO
